name: Build Android T.E-31

on:
  workflow_dispatch:
  push:
    paths:
      - "package.json"
      - "index.html"
      - "capacitor.config.json"
      - "www/**"
      - "resources/**"
      - "scripts/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - run: npm install
      - run: npm install --no-save sharp
      - run: npx cap add android
      - run: npx cap sync android
      - name: Apply official T.E-31 interface logo to Android app icon
        run: node scripts/generate-android-icons.cjs
      - name: Build installable APK
        working-directory: android
        run: ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TE31-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
      - name: Publish downloadable Android test APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: te31-android-v1.0.${{ github.run_number }}
          name: "T.E-31 Android — build ${{ github.run_number }}"
          body: |
            Installation Android de T.E-31 pour test direct.

            Cette version est compilée en APK de débogage. Elle n'est pas une publication Google Play Store.
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          make_latest: true
